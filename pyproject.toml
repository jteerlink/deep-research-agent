[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Configurable deep research agent foundation with async multi-provider search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Deep Research Agent contributors" }
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
search = [
  "ddgs>=9.0",
]
langgraph = [
  "langgraph>=0.2",
]
ui = [
  "ddgs>=9.0",
  "streamlit>=1.36",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.13",
]

[project.scripts]
deep-research-agent = "deep_research_agent.cli:main"

[tool.setuptools]
py-modules = ["async_multi_search"]
packages = ["deep_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["deep_research_agent"]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["async_multi_search", "streamlit", "streamlit.*"]
ignore_missing_imports = true
